services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qz-backend:latest
    container_name: qz-backend-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

  worker:
    image: qz-backend:latest
    container_name: qz-backend-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: qz-backend-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
